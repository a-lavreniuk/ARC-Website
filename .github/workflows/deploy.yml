name: Build and deploy ARC-Website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REG_RU_HOST: ${{ secrets.REG_RU_HOST }}
      REG_RU_USERNAME: ${{ secrets.REG_RU_USERNAME }}
      REG_RU_PASSWORD: ${{ secrets.REG_RU_PASSWORD }}
      REG_RU_PATH: ${{ secrets.REG_RU_PATH }}
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Upload to REG.RU Host-A over SSH
        if: ${{ env.REG_RU_HOST != '' && env.REG_RU_USERNAME != '' && env.REG_RU_PASSWORD != '' && env.REG_RU_PATH != '' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.REG_RU_HOST }}
          username: ${{ secrets.REG_RU_USERNAME }}
          password: ${{ secrets.REG_RU_PASSWORD }}
          port: ${{ secrets.REG_RU_PORT || 22 }}
          source: dist/*
          target: ${{ secrets.REG_RU_PATH }}
          strip_components: 1


